<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- VoltLab app icon: bolt in circuit on a dark rounded badge -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24334a"/>
      <stop offset="1" stop-color="#0b0f15"/>
    </linearGradient>
    <radialGradient id="bglow" cx="0.55" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#3a4f6e" stop-opacity="0.5"/>
      <stop offset="0.65" stop-color="#1a2432" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffe3b0"/>
      <stop offset="0.5" stop-color="#ffb454"/>
      <stop offset="1" stop-color="#e0862d"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- rounded badge -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bglow)"/>
  <rect x="19" y="19" width="474" height="474" rx="109" fill="none" stroke="#42597c" stroke-opacity="0.55" stroke-width="3"/>

  <!-- circuit traces passing behind the bolt: three feed from the left (one
       jogs like PCB routing), two continue right -->
  <g stroke="#3d5271" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 84 170 H 250"/>
    <path d="M 84 250 H 148 L 184 214 H 214"/>
    <path d="M 84 330 H 250"/>
    <path d="M 428 180 H 312"/>
    <path d="M 428 330 H 342"/>
  </g>
  <!-- via / terminal dots on the outer ends -->
  <g fill="#5f7086">
    <circle cx="84" cy="170" r="13"/>
    <circle cx="84" cy="250" r="13"/>
    <circle cx="84" cy="330" r="13"/>
    <circle cx="428" cy="180" r="13"/>
    <circle cx="428" cy="330" r="13"/>
  </g>

  <!-- the bolt, centered -->
  <path d="M296,104 L180,282 L248,282 L204,412 L340,224 L268,224 L326,104 Z"
        fill="url(#bolt)" filter="url(#glow)"/>
</svg>
