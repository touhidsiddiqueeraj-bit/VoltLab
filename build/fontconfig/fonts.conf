<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Minimal fontconfig for packaged VoltLab runs (AppImage / deb).

  Newer distro configs (/etc/fonts/conf.d/48-guessfamily.conf and friends) use
  syntax the fontconfig bundled with Electron cannot parse, which floods the
  terminal with "invalid attribute 'xsi:nil'" warnings on every launch. The
  Electron main process points FONTCONFIG_FILE at this file, so only the
  standard font directories and cache are configured — no distro conf.d.

  Fonts still come from the host system; only the distro-specific aliasing
  rules are skipped.
-->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir>~/.fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
